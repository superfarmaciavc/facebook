<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook - Super Farmacia</title>

<style>
*{
    box-sizing:border-box;
}

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#ffffff;

    font-family:
    Arial,
    "Segoe UI",
    "Segoe UI Emoji",
    "Apple Color Emoji",
    sans-serif;
}

.screen{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* CABECERA */

.header{
    height:10vh;
    min-height:82px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 3vw;

    background:#ffffff;
    border-bottom:1px solid #e4e9ef;
}

.brand h1{
    margin:0;
    font-size:2vw;
    font-weight:700;
    color:#174c87;
}

.brand p{
    margin:5px 0 0;
    font-size:1vw;
    color:#67798c;
}

.facebook-title{
    font-size:1.35vw;
    font-weight:bold;
    color:#1877f2;
}

/* CUERPO */

.post{
    flex:1;
    width:100%;
    height:90vh;

    display:grid;
    grid-template-columns:45% 55%;

    overflow:hidden;
}

/* IMAGEN */

.image-area{
    width:100%;
    height:100%;

    background:#f2f4f7;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.image-area img{
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    display:block;

    transition:opacity .4s ease;
}

/* PANEL DERECHO */

.info{
    width:100%;
    height:100%;

    background:#ffffff;

    padding:2.5vw 3vw;

    display:flex;
    flex-direction:column;

    overflow:hidden;
}

/* PERFIL */

.profile{
    display:flex;
    align-items:center;
    gap:15px;
}

.avatar{
    width:58px;
    height:58px;

    flex-shrink:0;

    border-radius:50%;

    background:#174c87;
    color:#ffffff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
    font-weight:bold;
}

.page-name{
    font-size:1.2vw;
    font-weight:bold;
    color:#174c87;
}

.date{
    margin-top:4px;
    font-size:.85vw;
    color:#8996a5;
}

/* DESCRIPCIÓN */

.description{
    margin-top:3vh;

    flex:1;

    font-size:1.32vw;
    line-height:1.5;

    color:#27394c;

    white-space:pre-wrap;
    overflow:hidden;

    padding-right:.5vw;
}

/* INTERACCIONES */

.stats{
    margin-top:2vh;
    padding:20px 0;

    display:grid;
    grid-template-columns:repeat(3,1fr);

    border-top:1px solid #e5eaf0;
    border-bottom:1px solid #e5eaf0;
}

.stat{
    text-align:center;
}

.stat-number{
    font-size:1.65vw;
    font-weight:bold;
    color:#174c87;
}

.stat-label{
    margin-top:6px;
    font-size:.82vw;
    color:#7d8996;
}

/* PARTE INFERIOR */

.bottom{
    margin-top:2vh;
    flex-shrink:0;
}

.progress{
    width:100%;
    height:5px;

    margin-bottom:18px;

    background:#e4e9ef;

    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#1877f2;
}

.footer{
    display:grid;
    grid-template-columns:1fr auto 1fr;

    align-items:center;
    gap:15px;
}

.link{
    color:#1877f2;
    font-size:.9vw;
    font-weight:bold;
    text-decoration:none;
    justify-self:start;
}

.counter{
    color:#8794a2;
    font-size:.88vw;
    justify-self:center;
}

.follow{
    background:#1877f2;
    color:#ffffff;

    padding:11px 20px;

    border-radius:24px;

    font-size:.9vw;
    font-weight:bold;

    justify-self:end;
}

.error{
    width:100vw;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:40px;

    text-align:center;

    font-size:28px;
    color:#174c87;
}
</style>
</head>

<body>

<div class="screen">

    <div class="header">

        <div class="brand">
            <h1>Super Farmacia Virgen de Copacabana</h1>
            <p>Nuestro compromiso es tu bienestar</p>
        </div>

        <div class="facebook-title">
            Facebook · @SuperFarmaciaVC
        </div>

    </div>

    <div class="post">

        <!-- IZQUIERDA: IMAGEN -->

        <div class="image-area">
            <img
                id="postImage"
                src=""
                alt="Publicación">
        </div>

        <!-- DERECHA: DESCRIPCIÓN -->

        <div class="info">

            <div class="profile">

                <div class="avatar">
                    SF
                </div>

                <div>
                    <div class="page-name">
                        Super Farmacia Virgen de Copacabana
                    </div>

                    <div
                        class="date"
                        id="postDate">
                        Publicación reciente
                    </div>
                </div>

            </div>

            <div
                class="description"
                id="postText">
            </div>

            <div class="stats">

                <div class="stat">
                    <div
                        class="stat-number"
                        id="likes">
                        —
                    </div>

                    <div class="stat-label">
                        👍 Reacciones
                    </div>
                </div>

                <div class="stat">
                    <div
                        class="stat-number"
                        id="comments">
                        —
                    </div>

                    <div class="stat-label">
                        💬 Comentarios
                    </div>
                </div>

                <div class="stat">
                    <div
                        class="stat-number"
                        id="shares">
                        —
                    </div>

                    <div class="stat-label">
                        ↗ Compartidos
                    </div>
                </div>

            </div>

            <div class="bottom">

                <div class="progress">
                    <div
                        class="progress-bar"
                        id="progressBar">
                    </div>
                </div>

                <div class="footer">

                    <a
                        class="link"
                        id="postLink"
                        href="https://www.facebook.com/SuperFarmaciaVC/"
                        target="_blank">
                        Ver publicación
                    </a>

                    <div
                        class="counter"
                        id="counter">
                        0 / 0
                    </div>

                    <div class="follow">
                        Síguenos en Facebook
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

/* CONFIGURACIÓN */

const TIEMPO_POR_PUBLICACION = 60000;
const RECARGAR_JSON = 3600000;

let posts = [];
let actual = 0;
let timerPosts = null;


/* CARGAR POSTS.JSON */

async function cargarPosts(){

    try{

        const respuesta = await fetch(
            "posts.json?t=" + Date.now(),
            {
                cache:"no-store"
            }
        );

        if(!respuesta.ok){
            throw new Error(
                "No se pudo cargar posts.json"
            );
        }

        const datos =
            await respuesta.json();

        if(
            !Array.isArray(datos)
            ||
            datos.length === 0
        ){
            throw new Error(
                "posts.json no tiene publicaciones"
            );
        }

        posts =
            datos.slice(0,3);

        actual = 0;

        mostrarPost(actual);

        if(timerPosts){
            clearInterval(timerPosts);
        }

        if(posts.length > 1){

            timerPosts =
                setInterval(
                    siguientePost,
                    TIEMPO_POR_PUBLICACION
                );

        }

    }

    catch(error){

        console.error(error);

        document.body.innerHTML =
        `
        <div class="error">
            No se pudieron cargar las publicaciones.
        </div>
        `;

    }

}


/* MOSTRAR POST */

function mostrarPost(index){

    const post =
        posts[index];

    if(!post){
        return;
    }

    const imagen =
        document.getElementById(
            "postImage"
        );

    imagen.style.opacity =
        "0";

    setTimeout(()=>{

        imagen.src =
            post.image || "";

        imagen.style.opacity =
            "1";

    },200);


    document.getElementById(
        "postDate"
    ).textContent =
        post.date ||
        "Publicación reciente";


    document.getElementById(
        "postText"
    ).textContent =
        post.text || "";


    document.getElementById(
        "likes"
    ).textContent =
        post.likes || "—";


    document.getElementById(
        "comments"
    ).textContent =
        post.comments_count ||
        "—";


    document.getElementById(
        "shares"
    ).textContent =
        post.shares ||
        "—";


    document.getElementById(
        "postLink"
    ).href =
        post.url ||
        "https://www.facebook.com/SuperFarmaciaVC/";


    document.getElementById(
        "counter"
    ).textContent =
        (index + 1)
        + " / "
        + posts.length;


    iniciarBarra();

}


/* SIGUIENTE PUBLICACIÓN */

function siguientePost(){

    actual++;

    if(
        actual >=
        posts.length
    ){
        actual = 0;
    }

    mostrarPost(actual);

}


/* BARRA DE TIEMPO */

function iniciarBarra(){

    const barra =
        document.getElementById(
            "progressBar"
        );

    barra.style.transition =
        "none";

    barra.style.width =
        "0%";

    setTimeout(()=>{

        barra.style.transition =
            "width 60s linear";

        barra.style.width =
            "100%";

    },100);

}


/* INICIAR */

cargarPosts();


/* REVISAR ACTUALIZACIONES CADA HORA */

setInterval(
    cargarPosts,
    RECARGAR_JSON
);

</script>

</body>
</html>
