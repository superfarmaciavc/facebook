<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Super Farmacia - Facebook</title>


    <style>

        *{
            box-sizing:border-box;
        }

        html,
        body{
            margin:0;
            padding:0;
            width:100%;
            height:100%;
            overflow:hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:#ffffff;
        }


        body{
            display:flex;
            flex-direction:column;
        }



        /* =====================================
           ENCABEZADO
        ====================================== */

        .header{

            width:100%;
            flex:0 0 80px;

            margin:0;
            padding:0 3vw;

            background:#1f5a96;
            color:#ffffff;

            display:flex;
            align-items:center;
            justify-content:space-between;

            border:0;
        }


        .header-title{
            font-size:26px;
            font-weight:700;
        }


        .header-subtitle{
            font-size:18px;
            font-weight:600;
        }



        /* =====================================
           CONTENIDO PRINCIPAL
        ====================================== */

        .screen{

            width:100%;
            flex:1;
            min-height:0;

            margin:0;
            padding:0;

            display:flex;

            background:#ffffff;
        }



        /* =====================================
           FOTO / VIDEO
        ====================================== */

        .media-area{

            width:45%;
            height:100%;

            margin:0;
            padding:0;

            overflow:hidden;

            background:#000000;

            display:flex;
            align-items:center;
            justify-content:center;
        }


        .media-area img,
        .media-area video{

            width:100%;
            height:100%;

            margin:0;
            padding:0;

            display:block;

            object-fit:cover;
            object-position:center;
        }


        #postVideo{
            display:none;
            background:#000000;
        }



        /* =====================================
           INFORMACIÓN DERECHA
        ====================================== */

        .info{

            width:55%;
            height:100%;

            min-height:0;

            padding:
                28px
                3vw
                20px
                3vw;

            display:flex;
            flex-direction:column;

            background:#ffffff;
        }



        /* =====================================
           PERFIL
        ====================================== */

        .profile{

            display:flex;
            align-items:center;

            gap:15px;

            margin-bottom:20px;

            flex-shrink:0;
        }


        .avatar{

            width:58px;
            height:58px;

            flex-shrink:0;

            border-radius:50%;

            background:#1f5a96;
            color:#ffffff;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:18px;
            font-weight:700;
        }


        .profile-data{

            display:flex;
            flex-direction:column;

            min-width:0;
        }


        .page-name{

            color:#0f172a;

            font-size:23px;
            font-weight:700;

            line-height:1.2;
        }


        .date{

            margin-top:4px;

            color:#65676b;

            font-size:14px;
        }



        /* =====================================
           DESCRIPCIÓN
        ====================================== */

        .description-wrap{

            flex:1;

            min-height:0;

            overflow:hidden;
        }


        .description{

            width:100%;
            height:100%;

            overflow:hidden;

            white-space:pre-wrap;

            color:#111827;

            font-size:25px;
            line-height:1.48;

            word-break:normal;
            overflow-wrap:break-word;
        }



        /* =====================================
           MÉTRICAS ESTILO FACEBOOK
        ====================================== */

        .stats{

            flex-shrink:0;

            min-height:64px;

            margin-top:16px;

            border-top:
                1px solid #dadde1;

            display:flex;
            align-items:center;
            justify-content:space-between;

            color:#65676b;

            font-size:16px;
        }



        .reactions{

            display:flex;
            align-items:center;

            gap:8px;
        }


        .reaction-circle{

            width:26px;
            height:26px;

            border-radius:50%;

            background:#1877f2;

            color:#ffffff;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:15px;

            border:2px solid #ffffff;
        }


        .reaction-number{

            color:#65676b;

            font-size:16px;
        }



        .stats-right{

            display:flex;
            align-items:center;

            gap:28px;
        }


        .fb-stat{

            display:flex;
            align-items:center;

            gap:6px;

            color:#65676b;

            white-space:nowrap;
        }


        .fb-stat-icon{

            width:20px;
            height:20px;

            display:flex;
            align-items:center;
            justify-content:center;
        }


        .fb-stat svg{

            width:18px;
            height:18px;

            fill:none;

            stroke:#65676b;

            stroke-width:1.8;
        }



        /* =====================================
           CARGANDO
        ====================================== */

        .loading{

            flex:1;

            width:100%;

            display:flex;
            align-items:center;
            justify-content:center;

            background:#ffffff;

            color:#1f5a96;

            font-size:26px;
        }



        /* =====================================
           PANTALLAS MÁS PEQUEÑAS
        ====================================== */

        @media(max-width:900px){

            .header{
                flex-basis:70px;
            }

            .header-title{
                font-size:20px;
            }

            .header-subtitle{
                font-size:14px;
            }

            .media-area{
                width:43%;
            }

            .info{
                width:57%;
                padding:
                    24px
                    2.5vw
                    16px
                    2.5vw;
            }

            .page-name{
                font-size:19px;
            }

            .description{
                font-size:20px;
            }

            .stats{
                font-size:14px;
            }

        }

    </style>

</head>


<body>



<!-- =====================================
     ENCABEZADO
====================================== -->

<header class="header">

    <div class="header-title">
        Super Farmacia Virgen de Copacabana
    </div>

    <div class="header-subtitle">
        Nuestro compromiso es tu bienestar
    </div>

</header>



<!-- =====================================
     CARGANDO
====================================== -->

<div
    id="loading"
    class="loading"
>
    Cargando publicación...
</div>



<!-- =====================================
     CONTENIDO
====================================== -->

<div
    id="screen"
    class="screen"
    style="display:none;"
>


    <!-- =====================================
         FOTO / VIDEO
    ====================================== -->

    <div class="media-area">


        <img
            id="postImage"
            src=""
            alt="Publicación"
        >


        <video
            id="postVideo"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        ></video>


    </div>



    <!-- =====================================
         INFORMACIÓN
    ====================================== -->

    <div class="info">


        <!-- PERFIL -->

        <div class="profile">


            <div class="avatar">
                SF
            </div>


            <div class="profile-data">


                <div class="page-name">
                    Super Farmacia Virgen de Copacabana
                </div>


                <div
                    class="date"
                    id="postDate"
                >
                    Publicación reciente
                </div>


            </div>


        </div>



        <!-- =====================================
             DESCRIPCIÓN
        ====================================== -->

        <div class="description-wrap">

            <div
                class="description"
                id="postText"
            ></div>

        </div>



        <!-- =====================================
             MÉTRICAS
        ====================================== -->

        <div class="stats">


            <!-- REACCIONES -->

            <div class="reactions">


                <div class="reaction-circle">
                    ♥
                </div>


                <span
                    class="reaction-number"
                    id="likes"
                >
                    —
                </span>


            </div>



            <!-- COMENTARIOS / COMPARTIDOS -->

            <div class="stats-right">


                <!-- COMENTARIOS -->

                <div class="fb-stat">


                    <span class="fb-stat-icon">

                        <svg
                            viewBox="0 0 24 24"
                        >

                            <path
                                d="
                                M21 11.5
                                a8.4 8.4 0 0 1-9 8.5
                                9.5 9.5 0 0 1-4-.9
                                L3 21
                                l1.4-4
                                A8.3 8.3 0 0 1 3 11.5
                                a9 9 0 0 1 18 0Z
                                "
                            />

                        </svg>

                    </span>


                    <span id="comments">
                        —
                    </span>


                    <span>
                        comentarios
                    </span>


                </div>



                <!-- COMPARTIDOS -->

                <div class="fb-stat">


                    <span class="fb-stat-icon">

                        <svg
                            viewBox="0 0 24 24"
                        >

                            <path
                                d="
                                M8 12
                                L16 5
                                V9
                                C20 9 21 13 21 17
                                C19 14 17 13 16 13
                                V17
                                Z
                                "
                            />

                        </svg>

                    </span>


                    <span id="shares">
                        —
                    </span>


                    <span>
                        compartidos
                    </span>


                </div>


            </div>


        </div>


    </div>


</div>



<script>


/* =========================================
   CONFIGURACIÓN
========================================= */

const POSTS_JSON =
    "posts.json";


const ACTUALIZACION_MS =
    60 * 60 * 1000;



/* =========================================
   CARGAR PUBLICACIÓN
========================================= */

async function cargarPublicacion(){

    try{


        const respuesta =
            await fetch(

                POSTS_JSON
                +
                "?t="
                +
                Date.now(),

                {
                    cache:"no-store"
                }

            );


        if(!respuesta.ok){

            throw new Error(
                "No se pudo cargar posts.json"
            );

        }


        const posts =
            await respuesta.json();


        if(
            !Array.isArray(posts)
            ||
            posts.length === 0
        ){

            throw new Error(
                "No existen publicaciones"
            );

        }


        const post =
            posts[0];



        const imagen =
            document.getElementById(
                "postImage"
            );


        const video =
            document.getElementById(
                "postVideo"
            );



        /* =================================
           VIDEO / REEL
        ================================= */

        if(
            post.type === "video"
            &&
            post.video
        ){

            imagen.style.display =
                "none";


            video.style.display =
                "block";


            const nuevaURL =
                new URL(
                    post.video,
                    window.location.href
                ).href;


            if(
                !video.src
                ||
                !video.src.startsWith(
                    nuevaURL
                )
            ){

                video.src =
                    post.video
                    +
                    "?t="
                    +
                    Date.now();


                video.load();


                video.play().catch(

                    error => {

                        console.log(
                            "No se pudo iniciar automáticamente:",
                            error
                        );

                    }

                );

            }

        }



        /* =================================
           FOTO
        ================================= */

        else{


            video.pause();


            video.removeAttribute(
                "src"
            );


            video.load();


            video.style.display =
                "none";


            imagen.style.display =
                "block";


            imagen.src =
                post.image
                ||
                "";

        }



        /* =================================
           DESCRIPCIÓN
        ================================= */

        document.getElementById(
            "postText"
        ).textContent =
            post.text
            ||
            "";



        /* =================================
           FECHA
        ================================= */

        document.getElementById(
            "postDate"
        ).textContent =
            post.date
            ||
            "Publicación reciente";



        /* =================================
           REACCIONES
        ================================= */

        document.getElementById(
            "likes"
        ).textContent =
            post.likes
            ||
            "—";



        /* =================================
           COMENTARIOS
        ================================= */

        document.getElementById(
            "comments"
        ).textContent =
            post.comments_count
            ||
            "—";



        /* =================================
           COMPARTIDOS
        ================================= */

        document.getElementById(
            "shares"
        ).textContent =
            post.shares
            ||
            "—";



        /* =================================
           MOSTRAR PANTALLA
        ================================= */

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "screen"
        ).style.display =
            "flex";


        requestAnimationFrame(
            ajustarDescripcion
        );


    }
    catch(error){


        console.error(
            error
        );


        document.getElementById(
            "loading"
        ).textContent =
            "No se pudo cargar la publicación.";


    }

}



/* =========================================
   AJUSTAR TEXTO AUTOMÁTICAMENTE
========================================= */

function ajustarDescripcion(){


    const texto =
        document.getElementById(
            "postText"
        );


    let tamaño =
        25;


    texto.style.fontSize =
        tamaño
        +
        "px";


    while(

        texto.scrollHeight
        >
        texto.clientHeight

        &&

        tamaño > 16

    ){

        tamaño--;


        texto.style.fontSize =
            tamaño
            +
            "px";

    }

}



/* =========================================
   SI EL VIDEO FALLA
========================================= */

document.getElementById(
    "postVideo"
).addEventListener(
    "error",
    function(){

        console.log(
            "El video no pudo reproducirse."
        );

        const video =
            document.getElementById(
                "postVideo"
            );

        const imagen =
            document.getElementById(
                "postImage"
            );


        video.style.display =
            "none";


        imagen.style.display =
            "block";

    }
);



/* =========================================
   CARGA INICIAL
========================================= */

cargarPublicacion();



/* =========================================
   ACTUALIZAR CADA HORA
========================================= */

setInterval(

    cargarPublicacion,

    ACTUALIZACION_MS

);



/* =========================================
   AJUSTE SI CAMBIA LA RESOLUCIÓN
========================================= */

window.addEventListener(

    "resize",

    ajustarDescripcion

);


</script>


</body>

</html>
