<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Super Farmacia - Facebook</title>

    <style>

        *{
            box-sizing:border-box;
        }

        html,
        body{
            margin:0;
            padding:0;
            width:100%;
            height:100%;
            overflow:hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:#ffffff;
            color:#172033;
        }


        /* =====================================
           ENCABEZADO
        ====================================== */

        .header{
            width:100%;
            height:80px;

            background:#174c87;
            color:#ffffff;

            display:flex;
            align-items:center;
            justify-content:space-between;

            padding:0 3vw;

            flex-shrink:0;
        }

        .header-title{
            font-size:26px;
            font-weight:700;
        }

        .header-subtitle{
            font-size:18px;
            font-weight:400;
        }


        /* =====================================
           CONTENIDO PRINCIPAL
        ====================================== */

        .screen{
            width:100vw;
            height:calc(100vh - 80px);

            display:flex;

            background:#ffffff;
        }


        /* =====================================
           IZQUIERDA: IMAGEN
        ====================================== */

        .image-area{
            width:45%;
            height:100%;

            display:flex;
            align-items:center;
            justify-content:center;

            background:#f4f6f8;

            overflow:hidden;
        }

        .image-area img{
            width:100%;
            height:100%;

            object-fit:contain;
            object-position:center;

            display:block;
        }


        /* =====================================
           DERECHA
        ====================================== */

        .info{
            width:55%;
            height:100%;

            padding:
                3.5vh
                3vw
                2.5vh
                3vw;

            display:flex;
            flex-direction:column;

            background:#ffffff;
        }


        /* =====================================
           PERFIL
        ====================================== */

        .profile{
            display:flex;
            align-items:center;

            gap:16px;

            flex-shrink:0;

            margin-bottom:2.2vh;
        }


        .avatar{
            width:64px;
            height:64px;

            flex-shrink:0;

            border-radius:50%;

            background:#174c87;
            color:#ffffff;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:20px;
            font-weight:700;

            letter-spacing:0.5px;
        }


        .profile-data{
            display:flex;
            flex-direction:column;

            min-width:0;
        }


        .page-name{
            font-size:24px;
            font-weight:700;

            line-height:1.2;

            color:#152238;
        }


        .date{
            margin-top:5px;

            font-size:15px;

            color:#6b7280;
        }


        /* =====================================
           DESCRIPCIÓN
        ====================================== */

        .description-wrap{
            flex:1;

            min-height:0;

            overflow:hidden;

            display:flex;
        }


        .description{
            width:100%;
            height:100%;

            font-size:26px;
            line-height:1.45;

            white-space:pre-wrap;

            overflow:hidden;

            color:#20242c;

            word-break:normal;
            overflow-wrap:break-word;
        }


        /* =====================================
           MÉTRICAS
        ====================================== */

        .stats{
            flex-shrink:0;

            border-top:1px solid #e6e9ee;

            margin-top:2vh;
            padding-top:2vh;

            display:flex;
            align-items:center;
            justify-content:space-between;

            gap:20px;

            color:#5d6470;

            font-size:18px;
        }


        .stat{
            display:flex;
            align-items:center;

            gap:8px;

            white-space:nowrap;
        }


        .reaction-icon{
            width:28px;
            height:28px;

            border-radius:50%;

            background:#1877f2;
            color:#ffffff;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:15px;
        }


        /* =====================================
           CARGANDO
        ====================================== */

        .loading{
            width:100%;
            height:calc(100vh - 80px);

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:28px;

            color:#174c87;
            background:#ffffff;
        }


        /* =====================================
           PANTALLAS PEQUEÑAS
        ====================================== */

        @media(max-width:900px){

            .header{
                height:70px;
            }

            .header-title{
                font-size:20px;
            }

            .header-subtitle{
                font-size:15px;
            }

            .screen{
                height:calc(100vh - 70px);
            }

            .loading{
                height:calc(100vh - 70px);
            }

            .image-area{
                width:43%;
            }

            .info{
                width:57%;
                padding:3vh 2.5vw;
            }

            .description{
                font-size:20px;
            }

            .page-name{
                font-size:20px;
            }

            .stats{
                font-size:15px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================
     ENCABEZADO
====================================== -->

<header class="header">

    <div class="header-title">
        Super Farmacia Virgen de Copacabana
    </div>

    <div class="header-subtitle">
        Nuestro compromiso es tu bienestar
    </div>

</header>



<!-- =====================================
     CARGANDO
====================================== -->

<div
    id="loading"
    class="loading"
>
    Cargando publicación...
</div>



<!-- =====================================
     CONTENIDO
====================================== -->

<div
    id="screen"
    class="screen"
    style="display:none;"
>


    <!-- IMAGEN -->

    <div class="image-area">

        <img
            id="postImage"
            src=""
            alt="Publicación"
        >

    </div>



    <!-- INFORMACIÓN -->

    <div class="info">


        <!-- PERFIL -->

        <div class="profile">


            <div class="avatar">
                SF
            </div>


            <div class="profile-data">

                <div class="page-name">
                    Super Farmacia Virgen de Copacabana
                </div>

                <div
                    class="date"
                    id="postDate"
                >
                    Publicación reciente
                </div>

            </div>


        </div>



        <!-- DESCRIPCIÓN -->

        <div class="description-wrap">

            <div
                class="description"
                id="postText"
            ></div>

        </div>



        <!-- MÉTRICAS -->

        <div class="stats">


            <div class="stat">

                <div class="reaction-icon">
                    ♥
                </div>

                <span id="likes">
                    —
                </span>

            </div>


            <div class="stat">

                <span>
                    💬
                </span>

                <span id="comments">
                    —
                </span>

                <span>
                    comentarios
                </span>

            </div>


            <div class="stat">

                <span>
                    ↗
                </span>

                <span id="shares">
                    —
                </span>

                <span>
                    compartidos
                </span>

            </div>


        </div>


    </div>


</div>



<script>


const POSTS_JSON = "posts.json";

const ACTUALIZACION_MS =
    60 * 60 * 1000;



async function cargarPublicacion(){

    try{

        const respuesta = await fetch(
            POSTS_JSON + "?t=" + Date.now(),
            {
                cache:"no-store"
            }
        );


        if(!respuesta.ok){

            throw new Error(
                "No se pudo cargar posts.json"
            );

        }


        const posts =
            await respuesta.json();


        if(
            !Array.isArray(posts)
            ||
            posts.length === 0
        ){

            throw new Error(
                "No hay publicaciones"
            );

        }


        const post =
            posts[0];


        /* IMAGEN */

        document.getElementById(
            "postImage"
        ).src =
            post.image || "";


        /* TEXTO */

        document.getElementById(
            "postText"
        ).textContent =
            post.text || "";


        /* FECHA */

        document.getElementById(
            "postDate"
        ).textContent =
            post.date
            ||
            "Publicación reciente";


        /* REACCIONES */

        document.getElementById(
            "likes"
        ).textContent =
            post.likes || "—";


        /* COMENTARIOS */

        document.getElementById(
            "comments"
        ).textContent =
            post.comments_count || "—";


        /* COMPARTIDOS */

        document.getElementById(
            "shares"
        ).textContent =
            post.shares || "—";


        /* MOSTRAR */

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "screen"
        ).style.display =
            "flex";


        requestAnimationFrame(
            ajustarDescripcion
        );


    }
    catch(error){

        console.error(
            "Error:",
            error
        );


        document.getElementById(
            "loading"
        ).textContent =
            "No se pudo cargar la publicación.";

    }

}



/* =====================================
   AJUSTAR TEXTO AUTOMÁTICAMENTE
====================================== */

function ajustarDescripcion(){

    const texto =
        document.getElementById(
            "postText"
        );


    let tamaño = 26;


    texto.style.fontSize =
        tamaño + "px";


    while(
        texto.scrollHeight
        >
        texto.clientHeight
        &&
        tamaño > 16
    ){

        tamaño--;

        texto.style.fontSize =
            tamaño + "px";

    }

}



/* =====================================
   CARGAR
====================================== */

cargarPublicacion();



/* =====================================
   ACTUALIZAR CADA HORA
====================================== */

setInterval(

    cargarPublicacion,

    ACTUALIZACION_MS

);



/* =====================================
   AJUSTE DE RESOLUCIÓN
====================================== */

window.addEventListener(
    "resize",
    ajustarDescripcion
);


</script>


</body>

</html>
