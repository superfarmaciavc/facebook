<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Super Farmacia Virgen de Copacabana</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f4f7fb;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 90px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      border-bottom: 1px solid #e5e9ef;
    }

    .brand h1 {
      margin: 0;
      color: #174c87;
      font-size: 28px;
    }

    .brand p {
      margin: 6px 0 0;
      color: #65758b;
      font-size: 16px;
    }

    .facebook-title {
      color: #1877f2;
      font-weight: 700;
      font-size: 18px;
    }

    .content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .facebook-box {
      width: 100%;
      max-width: 1000px;
      height: calc(100vh - 140px);
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 15px;
    }

    .fb-page {
      width: 100%;
    }
  </style>
</head>

<body>

  <!-- SDK de Facebook -->
  <div id="fb-root"></div>

  <script async defer crossorigin="anonymous"
    src="https://connect.facebook.net/es_LA/sdk.js#xfbml=1&version=v23.0">
  </script>

  <div class="screen">

    <div class="header">
      <div class="brand">
        <h1>Super Farmacia Virgen de Copacabana</h1>
        <p>Nuestro compromiso es tu bienestar</p>
      </div>

      <div class="facebook-title">
        Facebook · @SuperFarmaciaVC
      </div>
    </div>

    <div class="content">

      <div class="facebook-box">

        <div
          class="fb-page"
          data-href="https://www.facebook.com/SuperFarmaciaVC/"
          data-tabs="timeline"
          data-width="900"
          data-height="700"
          data-small-header="false"
          data-adapt-container-width="true"
          data-hide-cover="false"
          data-show-facepile="false">
          
          <blockquote
            cite="https://www.facebook.com/SuperFarmaciaVC/"
            class="fb-xfbml-parse-ignore">

            <a href="https://www.facebook.com/SuperFarmaciaVC/">
              Super Farmacia Virgen de Copacabana
            </a>

          </blockquote>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
