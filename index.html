<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Facebook - Super Farmacia Virgen de Copacabana</title>

<style>
*{
    box-sizing:border-box;
}

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:white;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    width:100vw;
    height:100vh;
}

.screen{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:white;
}

.header{
    height:110px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 50px;
    background:white;
    border-bottom:1px solid #e5e9ef;
}

.brand h1{
    margin:0;
    font-size:34px;
    color:#174c87;
    font-weight:700;
}

.brand p{
    margin:7px 0 0;
    font-size:20px;
    color:#65758b;
}

.facebook-title{
    font-size:26px;
    font-weight:bold;
    color:#1877f2;
}

.content{
    flex:1;
    width:100%;
    height:calc(100vh - 110px);
    overflow:hidden;
    background:white;
    position:relative;
}

.facebook-box{
    width:100%;
    height:100%;
    overflow:hidden;
    background:white;

    display:flex;
    justify-content:center;
    align-items:flex-start;
}

/*
Facebook limita el ancho del plugin.
Por eso lo ampliamos visualmente.
*/

.fb-wrapper{
    width:500px;
    height:700px;

    transform:scale(2.2);
    transform-origin:top center;

    margin-top:10px;
}

.fb-page{
    width:500px !important;
    height:700px !important;
}

/* Oculta scroll externo */
iframe{
    border:none !important;
}

</style>
</head>

<body>

<div id="fb-root"></div>

<script
    async
    defer
    crossorigin="anonymous"
    src="https://connect.facebook.net/es_LA/sdk.js#xfbml=1&version=v23.0">
</script>


<div class="screen">

    <div class="header">

        <div class="brand">
            <h1>Super Farmacia Virgen de Copacabana</h1>
            <p>Nuestro compromiso es tu bienestar</p>
        </div>

        <div class="facebook-title">
            Facebook · @SuperFarmaciaVC
        </div>

    </div>


    <div class="content">

        <div class="facebook-box">

            <div class="fb-wrapper">

                <div
                    class="fb-page"
                    data-href="https://www.facebook.com/SuperFarmaciaVC/"
                    data-tabs="timeline"
                    data-width="500"
                    data-height="700"
                    data-small-header="false"
                    data-adapt-container-width="false"
                    data-hide-cover="false"
                    data-show-facepile="false">

                    <blockquote
                        cite="https://www.facebook.com/SuperFarmaciaVC/"
                        class="fb-xfbml-parse-ignore">

                        <a href="https://www.facebook.com/SuperFarmaciaVC/">
                            Super Farmacia Virgen de Copacabana
                        </a>

                    </blockquote>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
