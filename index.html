<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Super Farmacia - Facebook</title>

    <style>

        *{
            box-sizing:border-box;
        }

        html,
        body{
            margin:0;
            padding:0;
            width:100%;
            height:100%;
            overflow:hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:#ffffff;
        }

        body{
            display:flex;
            flex-direction:column;
        }


        /* =====================================
           ENCABEZADO
        ====================================== */

        .header{
            width:100%;
            flex:0 0 80px;

            background:#1f5a96;
            color:#ffffff;

            display:flex;
            align-items:center;
            justify-content:space-between;

            padding:0 3vw;
        }

        .header-title{
            font-size:26px;
            font-weight:700;
        }

        .header-subtitle{
            font-size:18px;
            font-weight:600;
        }


        /* =====================================
           CONTENIDO PRINCIPAL
        ====================================== */

        .screen{
            width:100%;
            flex:1;
            min-height:0;

            display:flex;

            background:#ffffff;
        }


        /* =====================================
           ÁREA MULTIMEDIA
        ====================================== */

        .media-area{
            width:45%;
            height:100%;

            min-width:0;
            min-height:0;

            overflow:hidden;

            display:flex;
            align-items:center;
            justify-content:center;

            background:#ffffff;
        }

        #postImage,
        #postVideo{
            width:100%;
            height:100%;

            max-width:100%;
            max-height:100%;

            object-fit:contain;
            object-position:center center;

            background:#ffffff;

            display:block;
        }

        #postVideo{
            display:none;
        }


        /* =====================================
           LADO DERECHO
        ====================================== */

        .info{
            width:55%;
            height:100%;

            min-height:0;

            padding:
                28px
                3vw
                20px
                3vw;

            display:flex;
            flex-direction:column;

            background:#ffffff;
        }


        /* =====================================
           PERFIL
        ====================================== */

        .profile{
            display:flex;
            align-items:center;

            gap:15px;

            margin-bottom:20px;

            flex-shrink:0;
        }

        .avatar{
            width:58px;
            height:58px;

            flex-shrink:0;

            border-radius:50%;

            background:#1f5a96;
            color:#ffffff;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:18px;
            font-weight:700;
        }

        .profile-data{
            display:flex;
            flex-direction:column;

            min-width:0;
        }

        .page-name{
            color:#0f172a;

            font-size:23px;
            font-weight:700;

            line-height:1.2;
        }

        .date{
            margin-top:4px;

            color:#65676b;

            font-size:14px;
        }


        /* =====================================
           DESCRIPCIÓN
        ====================================== */

        .description-wrap{
            flex:1;
            min-height:0;
            overflow:hidden;
        }

        .description{
            width:100%;
            height:100%;

            overflow:hidden;

            white-space:pre-wrap;

            color:#111827;

            font-size:25px;
            line-height:1.48;

            word-break:normal;
            overflow-wrap:break-word;
        }


        /* =====================================
           INTERACCIONES
        ====================================== */

        .stats{
            flex-shrink:0;

            margin-top:18px;
            padding-top:16px;

            border-top:1px solid #dadde1;

            display:flex;
            align-items:stretch;
            justify-content:space-between;

            gap:14px;
        }

        .interaction-item{
            flex:1;

            display:flex;
            align-items:center;

            gap:13px;

            min-height:72px;

            padding:12px 16px;

            border-radius:14px;

            background:#f6f7f9;
        }

        .interaction-icon{
            width:42px;
            height:42px;

            flex-shrink:0;

            border-radius:50%;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:19px;

            background:#edf0f4;
        }

        .interaction-icon.like{
            background:#e7f0ff;
        }

        .interaction-text{
            display:flex;
            flex-direction:column;

            line-height:1.1;
        }

        .interaction-number{
            font-size:25px;
            font-weight:700;

            color:#1c1e21;
        }

        .interaction-label{
            margin-top:5px;

            font-size:14px;
            font-weight:500;

            color:#65676b;
        }


        /* =====================================
           CARGANDO
        ====================================== */

        .loading{
            flex:1;

            width:100%;

            display:flex;
            align-items:center;
            justify-content:center;

            background:#ffffff;

            color:#1f5a96;

            font-size:26px;
        }


        /* =====================================
           PANTALLAS PEQUEÑAS
        ====================================== */

        @media(max-width:900px){

            .header{
                flex-basis:70px;
            }

            .header-title{
                font-size:20px;
            }

            .header-subtitle{
                font-size:14px;
            }

            .media-area{
                width:43%;
            }

            .info{
                width:57%;

                padding:
                    24px
                    2.5vw
                    16px
                    2.5vw;
            }

            .page-name{
                font-size:19px;
            }

            .description{
                font-size:20px;
            }

            .interaction-item{
                min-height:64px;
                padding:10px 12px;
            }

            .interaction-icon{
                width:36px;
                height:36px;
                font-size:17px;
            }

            .interaction-number{
                font-size:21px;
            }

            .interaction-label{
                font-size:12px;
            }
        }

    </style>

</head>


<body>


<!-- =====================================
     ENCABEZADO
====================================== -->

<header class="header">

    <div class="header-title">
        Super Farmacia Virgen de Copacabana
    </div>

    <div class="header-subtitle">
        Nuestro compromiso es tu bienestar
    </div>

</header>


<!-- =====================================
     CARGANDO
====================================== -->

<div
    id="loading"
    class="loading"
>
    Cargando publicación...
</div>


<!-- =====================================
     CONTENIDO
====================================== -->

<div
    id="screen"
    class="screen"
    style="display:none;"
>


    <!-- FOTO / VIDEO -->

    <div
        class="media-area"
        id="mediaArea"
    >

        <img
            id="postImage"
            src=""
            alt="Publicación"
        >

        <video
            id="postVideo"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        ></video>

    </div>


    <!-- INFORMACIÓN -->

    <div class="info">


        <!-- PERFIL -->

        <div class="profile">

            <div class="avatar">
                SF
            </div>

            <div class="profile-data">

                <div class="page-name">
                    Super Farmacia Virgen de Copacabana
                </div>

                <div
                    class="date"
                    id="postDate"
                >
                    Publicación reciente
                </div>

            </div>

        </div>


        <!-- DESCRIPCIÓN -->

        <div class="description-wrap">

            <div
                class="description"
                id="postText"
            ></div>

        </div>


        <!-- INTERACCIONES -->

        <div class="stats">


            <div class="interaction-item">

                <div class="interaction-icon like">
                    👍
                </div>

                <div class="interaction-text">

                    <span
                        class="interaction-number"
                        id="likes"
                    >
                        —
                    </span>

                    <span class="interaction-label">
                        Me gusta
                    </span>

                </div>

            </div>


            <div class="interaction-item">

                <div class="interaction-icon">
                    💬
                </div>

                <div class="interaction-text">

                    <span
                        class="interaction-number"
                        id="comments"
                    >
                        —
                    </span>

                    <span class="interaction-label">
                        Comentarios
                    </span>

                </div>

            </div>


            <div class="interaction-item">

                <div class="interaction-icon">
                    ↗
                </div>

                <div class="interaction-text">

                    <span
                        class="interaction-number"
                        id="shares"
                    >
                        —
                    </span>

                    <span class="interaction-label">
                        Compartidos
                    </span>

                </div>

            </div>


        </div>


    </div>

</div>


<script>


/* =========================================
   CONFIGURACIÓN
========================================= */

const POSTS_JSON =
    "posts.json";

const ACTUALIZACION_MS =
    60 * 60 * 1000;


/* =========================================
   CARGAR PUBLICACIÓN
========================================= */

async function cargarPublicacion(){

    try{

        const respuesta =
            await fetch(
                POSTS_JSON
                +
                "?t="
                +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!respuesta.ok){

            throw new Error(
                "No se pudo cargar posts.json"
            );

        }


        const posts =
            await respuesta.json();


        if(
            !Array.isArray(posts)
            ||
            posts.length === 0
        ){

            throw new Error(
                "No existen publicaciones"
            );

        }


        const post =
            posts[0];


        const imagen =
            document.getElementById(
                "postImage"
            );


        const video =
            document.getElementById(
                "postVideo"
            );


        /* =================================
           VIDEO / REEL
        ================================= */

        if(
            post.type === "video"
            &&
            post.video
        ){

            imagen.style.display =
                "none";


            video.style.display =
                "block";


            video.style.objectFit =
                "contain";


            video.style.background =
                "#ffffff";


            video.src =
                post.video
                +
                "?t="
                +
                Date.now();


            video.load();


            video.play().catch(

                error => {

                    console.log(
                        "Autoplay:",
                        error
                    );

                }

            );

        }


        /* =================================
           IMAGEN
        ================================= */

        else{

            video.pause();


            video.removeAttribute(
                "src"
            );


            video.load();


            video.style.display =
                "none";


            imagen.style.display =
                "block";


            imagen.style.objectFit =
                "contain";


            imagen.style.background =
                "#ffffff";


            imagen.src =
                post.image
                ||
                "";

        }


        /* =================================
           TEXTO
        ================================= */

        document.getElementById(
            "postText"
        ).textContent =
            post.text
            ||
            "";


        /* =================================
           FECHA
        ================================= */

        document.getElementById(
            "postDate"
        ).textContent =
            post.date
            ||
            "Publicación reciente";


        /* =================================
           INTERACCIONES
        ================================= */

        document.getElementById(
            "likes"
        ).textContent =
            post.likes
            ||
            "—";


        document.getElementById(
            "comments"
        ).textContent =
            post.comments_count
            ||
            "—";


        document.getElementById(
            "shares"
        ).textContent =
            post.shares
            ||
            "—";


        /* =================================
           MOSTRAR
        ================================= */

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "screen"
        ).style.display =
            "flex";


        requestAnimationFrame(
            ajustarDescripcion
        );

    }

    catch(error){

        console.error(
            error
        );


        document.getElementById(
            "loading"
        ).textContent =
            "No se pudo cargar la publicación.";

    }

}


/* =========================================
   AJUSTAR DESCRIPCIÓN
========================================= */

function ajustarDescripcion(){

    const texto =
        document.getElementById(
            "postText"
        );


    let tamaño = 25;


    texto.style.fontSize =
        tamaño + "px";


    while(
        texto.scrollHeight
        >
        texto.clientHeight
        &&
        tamaño > 16
    ){

        tamaño--;

        texto.style.fontSize =
            tamaño + "px";

    }

}


/* =========================================
   FALLBACK SI FALLA VIDEO
========================================= */

document.getElementById(
    "postVideo"
).addEventListener(
    "error",
    function(){

        const video =
            document.getElementById(
                "postVideo"
            );


        const imagen =
            document.getElementById(
                "postImage"
            );


        video.style.display =
            "none";


        imagen.style.display =
            "block";


        console.log(
            "No se pudo reproducir el video. Mostrando portada."
        );

    }
);


/* =========================================
   CARGA INICIAL
========================================= */

cargarPublicacion();


/* =========================================
   ACTUALIZACIÓN CADA HORA
========================================= */

setInterval(
    cargarPublicacion,
    ACTUALIZACION_MS
);


/* =========================================
   AJUSTAR SI CAMBIA RESOLUCIÓN
========================================= */

window.addEventListener(
    "resize",
    ajustarDescripcion
);


</script>


</body>

</html>
