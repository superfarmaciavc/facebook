<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook - Super Farmacia</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #ffffff;
}

.screen {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  height: 11vh;
  min-height: 90px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 3vw;
  background: #ffffff;
  border-bottom: 1px solid #e5e9ef;
}

.brand h1 {
  margin: 0;
  font-size: 2vw;
  color: #174c87;
}

.brand p {
  margin: 6px 0 0;
  font-size: 1.05vw;
  color: #67798c;
}

.facebook {
  color: #1877f2;
  font-size: 1.4vw;
  font-weight: bold;
}

.post {
  flex: 1;
  height: 89vh;
  display: grid;
  grid-template-columns: 60% 40%;
}

.image-area {
  width: 100%;
  height: 100%;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.image-area img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity .5s ease;
}

.info {
  background: white;
  padding: 2.5vw;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.profile {
  display: flex;
  align-items: center;
  gap: 15px;
}

.avatar {
  width: 60px;
  height: 60px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #174c87;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: bold;
}

.page-name {
  color: #174c87;
  font-size: 1.2vw;
  font-weight: bold;
}

.date {
  margin-top: 5px;
  color: #8996a5;
  font-size: .85vw;
}

.text {
  margin-top: 2.4vh;
  font-size: 1.2vw;
  line-height: 1.45;
  color: #27394c;
  overflow: hidden;
  max-height: 30vh;
}

.stats {
  display: flex;
  gap: 30px;
  margin-top: 2.5vh;
  padding: 18px 0;
  border-top: 1px solid #e5eaf0;
  border-bottom: 1px solid #e5eaf0;
  color: #526475;
  font-size: 1vw;
}

.comments {
  margin-top: 2vh;
}

.comments-title {
  color: #174c87;
  font-size: 1vw;
  font-weight: bold;
  margin-bottom: 12px;
}

.comment {
  padding: 11px 14px;
  margin-bottom: 9px;
  border-radius: 12px;
  background: #f4f6f9;
  color: #37495a;
  font-size: .85vw;
  line-height: 1.35;
}

.no-comments {
  color: #8996a5;
  font-size: .9vw;
}

.bottom {
  margin-top: auto;
}

.progress {
  width: 100%;
  height: 5px;
  background: #e5eaf0;
  overflow: hidden;
  border-radius: 10px;
  margin-bottom: 17px;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: #1877f2;
}

.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.facebook-link {
  color: #1877f2;
  font-size: .9vw;
  font-weight: bold;
  text-decoration: none;
}

.counter {
  color: #8794a2;
  font-size: .85vw;
}

.follow {
  padding: 11px 18px;
  border-radius: 25px;
  background: #1877f2;
  color: white;
  font-size: .9vw;
  font-weight: bold;
}

.error {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #174c87;
  font-size: 28px;
  text-align: center;
  padding: 40px;
}
</style>
</head>

<body>

<div class="screen">

  <div class="header">
    <div class="brand">
      <h1>Super Farmacia Virgen de Copacabana</h1>
      <p>Nuestro compromiso es tu bienestar</p>
    </div>

    <div class="facebook">
      Facebook · @SuperFarmaciaVC
    </div>
  </div>

  <div class="post">

    <div class="image-area">
      <img id="postImage" src="" alt="Publicación">
    </div>

    <div class="info">

      <div class="profile">
        <div class="avatar">SF</div>

        <div>
          <div class="page-name">
            Super Farmacia Virgen de Copacabana
          </div>

          <div class="date" id="postDate"></div>
        </div>
      </div>

      <div class="text" id="postText"></div>

      <div class="stats">
        <div id="likes">👍 —</div>
        <div id="commentsCount">💬 —</div>
        <div id="shares">↗ —</div>
      </div>

      <div class="comments">
        <div class="comments-title">Comentarios</div>
        <div id="commentsBox"></div>
      </div>

      <div class="bottom">

        <div class="progress">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="footer">

          <a
            id="postLink"
            class="facebook-link"
            href="https://www.facebook.com/SuperFarmaciaVC/"
            target="_blank">
            Ver publicación
          </a>

          <div class="counter" id="counter"></div>

          <div class="follow">
            Síguenos en Facebook
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<script>

const TIEMPO_POR_POST = 60000;

let posts = [];
let currentPost = 0;
let postTimer = null;

async function cargarPosts() {
  try {
    const response = await fetch(
      "posts.json?t=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("No se pudo cargar posts.json");
    }

    const data = await response.json();

    if (!Array.isArray(data) || data.length === 0) {
      throw new Error("posts.json está vacío");
    }

    posts = data.slice(0, 3);
    currentPost = 0;

    mostrarPost(currentPost);

    if (postTimer) {
      clearInterval(postTimer);
    }

    postTimer = setInterval(
      siguientePost,
      TIEMPO_POR_POST
    );

  } catch (error) {
    console.error(error);

    document.body.innerHTML = `
      <div class="error">
        No se pudieron cargar las publicaciones.
      </div>
    `;
  }
}

function mostrarPost(index) {
  const post = posts[index];

  const image = document.getElementById("postImage");
  image.style.opacity = 0;

  setTimeout(() => {
    image.src = post.image || "";
    image.style.opacity = 1;
  }, 250);

  document.getElementById("postDate").innerText =
    post.date || "Publicación reciente";

  document.getElementById("postText").innerHTML =
    formatearTexto(post.text || "");

  document.getElementById("likes").innerText =
    "👍 " + (post.likes || "—");

  document.getElementById("commentsCount").innerText =
    "💬 " + (post.comments_count || "—");

  document.getElementById("shares").innerText =
    "↗ " + (post.shares || "—");

  document.getElementById("postLink").href =
    post.url || "https://www.facebook.com/SuperFarmaciaVC/";

  document.getElementById("counter").innerText =
    (index + 1) + " / " + posts.length;

  mostrarComentarios(post.comments || []);

  iniciarBarra();
}

function siguientePost() {
  currentPost++;

  if (currentPost >= posts.length) {
    currentPost = 0;
  }

  mostrarPost(currentPost);
}

function mostrarComentarios(comments) {
  const box = document.getElementById("commentsBox");
  box.innerHTML = "";

  if (!comments || comments.length === 0) {
    box.innerHTML = `
      <div class="no-comments">
        Sin comentarios disponibles
      </div>
    `;
    return;
  }

  comments.slice(0, 3).forEach(comment => {
    const div = document.createElement("div");
    div.className = "comment";

    if (typeof comment === "string") {
      div.innerText = comment;
    } else {
      div.innerText =
        (comment.name ? comment.name + ": " : "") +
        (comment.message || "");
    }

    box.appendChild(div);
  });
}

function iniciarBarra() {
  const bar = document.getElementById("progressBar");

  bar.style.transition = "none";
  bar.style.width = "0%";

  setTimeout(() => {
    bar.style.transition = "width 60s linear";
    bar.style.width = "100%";
  }, 100);
}

function formatearTexto(text) {
  return text.replace(/\n/g, "<br>");
}

cargarPosts();

/* Revisa si GitHub actualizó posts.json cada hora */
setInterval(cargarPosts, 3600000);

</script>

</body>
</html>
