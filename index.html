<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Facebook - Super Farmacia</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: white;
}

.screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* CABECERA */

.header {
    height: 10vh;
    min-height: 85px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 3vw;

    background: white;

    border-bottom: 1px solid #e5e9ef;
}

.brand h1 {
    margin: 0;

    font-size: 2vw;

    color: #174c87;
}

.brand p {
    margin: 5px 0 0;

    font-size: 1vw;

    color: #67798c;
}

.facebook {
    color: #1877f2;

    font-size: 1.4vw;

    font-weight: bold;
}

/* PUBLICACIÓN */

.post {
    flex: 1;

    height: 90vh;

    display: grid;

    grid-template-columns: 62% 38%;
}

/* IMAGEN */

.image-area {
    width: 100%;
    height: 100%;

    background: #f2f2f2;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.image-area img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    transition: opacity .5s ease;

    background: #f5f5f5;
}

/* INFORMACIÓN */

.info {
    background: white;

    padding: 3vw;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

.profile {
    display: flex;
    align-items: center;

    gap: 15px;
}

.avatar {
    width: 62px;
    height: 62px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #174c87;

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 18px;
    font-weight: bold;
}

.page-name {
    font-size: 1.25vw;

    font-weight: bold;

    color: #174c87;
}

.date {
    margin-top: 5px;

    font-size: .9vw;

    color: #8996a5;
}

/* DESCRIPCIÓN */

.description {
    margin-top: 4vh;

    font-size: 1.45vw;

    line-height: 1.5;

    color: #27394c;

    overflow: hidden;
}

/* INTERACCIONES */

.stats {
    margin-top: 4vh;

    padding: 22px 0;

    display: flex;

    justify-content: space-around;

    border-top: 1px solid #e5eaf0;
    border-bottom: 1px solid #e5eaf0;
}

.stat {
    text-align: center;
}

.stat-number {
    font-size: 1.7vw;

    font-weight: bold;

    color: #174c87;
}

.stat-label {
    margin-top: 5px;

    font-size: .8vw;

    color: #7d8996;
}

/* INFERIOR */

.bottom {
    margin-top: auto;
}

.progress {
    width: 100%;

    height: 5px;

    margin-bottom: 20px;

    background: #e5eaf0;

    border-radius: 10px;

    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;

    background: #1877f2;
}

.footer {
    display: flex;

    align-items: center;

    justify-content: space-between;
}

.link {
    color: #1877f2;

    font-weight: bold;

    text-decoration: none;

    font-size: .9vw;
}

.counter {
    color: #8794a2;

    font-size: .85vw;
}

.follow {
    padding: 12px 20px;

    border-radius: 25px;

    background: #1877f2;

    color: white;

    font-size: .9vw;

    font-weight: bold;
}

</style>

</head>


<body>

<div class="screen">

    <div class="header">

        <div class="brand">

            <h1>
                Super Farmacia Virgen de Copacabana
            </h1>

            <p>
                Nuestro compromiso es tu bienestar
            </p>

        </div>

        <div class="facebook">
            Facebook · @SuperFarmaciaVC
        </div>

    </div>


    <div class="post">

        <!-- IMAGEN -->

        <div class="image-area">

            <img
            id="postImage"
            src=""
            alt="Publicación">

        </div>


        <!-- INFORMACIÓN -->

        <div class="info">

            <div class="profile">

                <div class="avatar">
                    SF
                </div>

                <div>

                    <div class="page-name">
                        Super Farmacia Virgen de Copacabana
                    </div>

                    <div
                    class="date"
                    id="postDate">

                        Publicación reciente

                    </div>

                </div>

            </div>


            <!-- DESCRIPCIÓN -->

            <div
            class="description"
            id="postText">
            </div>


            <!-- INTERACCIONES -->

            <div class="stats">

                <div class="stat">

                    <div
                    class="stat-number"
                    id="likes">

                        —

                    </div>

                    <div class="stat-label">
                        👍 Reacciones
                    </div>

                </div>


                <div class="stat">

                    <div
                    class="stat-number"
                    id="comments">

                        —

                    </div>

                    <div class="stat-label">
                        💬 Comentarios
                    </div>

                </div>


                <div class="stat">

                    <div
                    class="stat-number"
                    id="shares">

                        —

                    </div>

                    <div class="stat-label">
                        ↗ Compartidos
                    </div>

                </div>

            </div>


            <div class="bottom">

                <div class="progress">

                    <div
                    class="progress-bar"
                    id="progressBar">
                    </div>

                </div>


                <div class="footer">

                    <a
                    class="link"
                    id="postLink"
                    target="_blank">

                        Ver publicación

                    </a>


                    <div
                    class="counter"
                    id="counter">
                    </div>


                    <div class="follow">
                        Síguenos en Facebook
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

const TIEMPO_POST = 60000;

let posts = [];

let actual = 0;

let timer;


/* CARGAR PUBLICACIONES */

async function cargarPosts(){

    try {

        const respuesta =
        await fetch(
            "posts.json?t=" +
            Date.now()
        );

        posts =
        await respuesta.json();

        posts =
        posts.slice(0,3);

        actual = 0;

        mostrarPost();

        if(timer){
            clearInterval(timer);
        }

        timer =
        setInterval(
            siguiente,
            TIEMPO_POST
        );

    }

    catch(error){

        console.error(error);

    }

}


/* MOSTRAR POST */

function mostrarPost(){

    const post =
    posts[actual];


    const imagen =
    document.getElementById(
        "postImage"
    );


    imagen.style.opacity = 0;


    setTimeout(()=>{

        imagen.src =
        post.image;

        imagen.style.opacity = 1;

    },250);


    document.getElementById(
        "postText"
    ).innerText =
    post.text || "";


    document.getElementById(
        "postDate"
    ).innerText =
    post.date ||
    "Publicación reciente";


    document.getElementById(
        "likes"
    ).innerText =
    post.likes || "—";


    document.getElementById(
        "comments"
    ).innerText =
    post.comments_count || "—";


    document.getElementById(
        "shares"
    ).innerText =
    post.shares || "—";


    document.getElementById(
        "postLink"
    ).href =
    post.url;


    document.getElementById(
        "counter"
    ).innerText =
    (actual + 1)
    + " / "
    + posts.length;


    barraTiempo();

}


/* SIGUIENTE */

function siguiente(){

    actual++;

    if(
        actual >=
        posts.length
    ){
        actual = 0;
    }

    mostrarPost();

}


/* BARRA 1 MINUTO */

function barraTiempo(){

    const barra =
    document.getElementById(
        "progressBar"
    );


    barra.style.transition =
    "none";

    barra.style.width =
    "0%";


    setTimeout(()=>{

        barra.style.transition =
        "width 60s linear";

        barra.style.width =
        "100%";

    },100);

}


/* INICIAR */

cargarPosts();


/* COMPROBAR CAMBIOS CADA HORA */

setInterval(
    cargarPosts,
    3600000
);

</script>

</body>

</html>
