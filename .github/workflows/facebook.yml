name: Actualizar Facebook

on:
  schedule:
    # Todos los días a las 09:00 hora Bolivia
    # Bolivia = UTC-4, GitHub usa UTC
    - cron: "0 13 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-facebook:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium
        run: |
          playwright install chromium --with-deps

      - name: Ejecutar scraper de Facebook
        run: |
          python scrape_fb.py

      - name: Guardar actualización
        run: |
          git config user.name "Facebook TV Bot"
          git config user.email "actions@github.com"

          git add posts.json posts/

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar publicación de Facebook"
            git push
          fi
